# backend/src/main/resources/application-prod.properties

# 1. 关闭 SQL 打印，极大提升服务器运行性能
spring.jpa.show-sql=false

# 2. 使用云服务器上的绝对路径 (Bulletproof 写法，防止路径错乱)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 3. 覆盖图片上传和读取的绝对路径
spring.web.resources.static-locations=file:${APP_UPLOAD_DIR:/home/ubuntu/apps/shopping/backend/uploads/}
app.upload.dir=${APP_UPLOAD_DIR:/home/ubuntu/apps/shopping/backend/uploads/}

server.servlet.session.cookie.max-age=86400
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 【新增】强制 Cookie 只能在 HTTPS 下传输 (防窃听)
server.servlet.session.cookie.secure=true
# Required deployment origin for payment redirects and credentialed CORS.
frontend.url=${FRONTEND_URL}
server.address=127.0.0.1
