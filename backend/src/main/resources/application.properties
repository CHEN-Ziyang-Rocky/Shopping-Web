# backend/src/main/resources/application.properties
spring.application.name=s57

# --- 数据库配置 (本地开发) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/shopping_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=10000&socketTimeout=30000}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shop_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
spring.jackson.deserialization.accept-float-as-int=false

# --- 文件上传限制 ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- 本地图片路径映射 ---
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:uploads/
app.upload.dir=uploads/

# ================= 安全 Session / Cookie 配置 =================
# 需求: 0 < expires < 3 days (这里设置为 1 天 / 86400秒)
server.servlet.session.cookie.max-age=86400

# 需求: Configure all authentication cookies to use the HttpOnly flags (防 XSS)
server.servlet.session.cookie.http-only=true

# 需求: Apply SameSite cookie (防 CSRF 的第一道防线)
server.servlet.session.cookie.same-site=lax

# [注意] 如果你本地开发用的是 http://localhost，secure 必须是 false。
# 但是在 application-prod.properties 里，你必须加上下面这行：
# server.servlet.session.cookie.secure=true

# ================= Stripe Payment Configuration =================
# 你的 Stripe 测试环境 Secret Key (去 Stripe Dashboard -> Developers -> API keys 获取)
stripe.api.key=${STRIPE_API_KEY:}
# Webhook Secret (在配置 Webhook 时生成，用于验证回调请求的真实性)
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# 商户信息 (用于生成 Digest)
shop.merchant.email=your_email@example.com
shop.currency=HKD

# 前端地址 (支付成功或取消后跳转的回调地址)
frontend.url=${FRONTEND_URL:http://localhost:3000}
# Optional developer-local secrets; never commit this file.
spring.config.import=optional:file:./config/local-secrets.properties
server.servlet.session.timeout=30m
shop.bootstrap.enabled=${SHOP_BOOTSTRAP_ENABLED:false}
